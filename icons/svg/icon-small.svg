<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4A3778"/>
      <stop offset="0.45" stop-color="#2C2049"/>
      <stop offset="1" stop-color="#141021"/>
    </linearGradient>
    <linearGradient id="glyph" x1="0.2" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D3DEEC"/>
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#0B0812"/>
      <stop offset="1" stop-color="#17102A"/>
    </linearGradient>
    <linearGradient id="grn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#66EA92"/>
      <stop offset="1" stop-color="#2FBF64"/>
    </linearGradient>
  </defs>

  <rect x="24" y="24" width="976" height="976" rx="220" fill="url(#tile)"/>
  <rect x="26" y="26" width="972" height="972" rx="218" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="4"/>

  <!-- 猫尾（加粗，小尺寸可辨） -->
  <path d="M560 726 C 800 752, 962 704, 958 594 C 955 508, 892 466, 862 500"
        fill="none" stroke="url(#glyph)" stroke-width="60" stroke-linecap="round"/>

  <!-- 显示器 + 猫耳 -->
  <g fill="url(#glyph)">
    <rect x="368" y="690" width="286" height="54" rx="27"/>
    <path d="M462 580 H562 L584 696 H440 Z"/>
    <rect x="196" y="236" width="632" height="368" rx="52"/>
    <path d="M240 262 L282 116 L406 250 Z" stroke="url(#glyph)" stroke-width="34" stroke-linejoin="round"/>
    <path d="M784 262 L742 116 L618 250 Z" stroke="url(#glyph)" stroke-width="34" stroke-linejoin="round"/>
    <rect x="262" y="302" width="500" height="238" rx="28" fill="url(#win)"/>
  </g>

  <!-- 简化 Git 图：两个提交点 -->
  <path d="M382 356 V494" stroke="url(#grn)" stroke-width="34" opacity="0.6" stroke-linecap="round" fill="none"/>
  <circle cx="382" cy="356" r="44" fill="url(#grn)"/>
  <circle cx="382" cy="494" r="44" fill="url(#grn)"/>
</svg>
