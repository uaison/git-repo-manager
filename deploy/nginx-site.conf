# GitNest 法律文档静态站点 —— uaison.top/gitnest/
#
# 文件放置（放在站点根目录下的 gitnest 文件夹）：
#   /var/www/uaison.top/gitnest/index.html
#   /var/www/uaison.top/gitnest/privacy.html
#   /var/www/uaison.top/gitnest/eula.html
#
# 访问地址：
#   https://uaison.top/gitnest/            （首页）
#   https://uaison.top/gitnest/privacy.html（填到 Partner Center 的隐私政策 URL）
#   https://uaison.top/gitnest/eula.html
#
# 说明：若 uaison.top 已有 server 块且静态文件由 `location /` 提供，
# 只需把文件放进站点根的 gitnest/ 目录即可访问，无需改动 nginx。
# 下面的 server 块是完整示例；文件若放在站点根之外，用文末的 alias 写法。

server {
    listen 80;
    server_name uaison.top www.uaison.top;
    return 301 https://uaison.top$request_uri;
}

server {
    listen 443 ssl;
    http2 on;                      # nginx < 1.25.1 请改用: listen 443 ssl http2;
    server_name uaison.top www.uaison.top;

    ssl_certificate     /etc/letsencrypt/live/uaison.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uaison.top/privkey.pem;

    root  /var/www/uaison.top;
    index index.html;
    charset utf-8;

    # 法律文档目录：确保以 HTML 返回、可被匿名访问
    location /gitnest/ {
        try_files $uri $uri/ =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=300" always;
    }
}

# ---------- 备选：文件不放在站点根下 ----------
# 把上面 server 块里的 location /gitnest/ 替换为：
#
# location /gitnest/ {
#     alias /var/www/gitnest-legal/;
#     index index.html;
#     charset utf-8;
#     add_header X-Content-Type-Options "nosniff" always;
# }
#
# 注意 alias 末尾斜杠与 location 末尾斜杠必须一致。
#
# 提交前自查：
#   - 无痕窗口能打开，无需登录
#   - 直接返回 200 页面（不是下载文件）
#   - Content-Type: text/html; charset=utf-8
#   - robots.txt 未屏蔽 /gitnest/
#   - 境外网络可访问
