# 推送 v* 标签时自动构建 Windows 安装包并发布 Release
#
# 触发：git tag v1.0.0 && git push origin v1.0.0
# 前置：package.json 的 version 必须与标签一致（去掉前缀 v）
# 说明：隐私政策 / 许可协议站点由 pages.yml 自动发布到 GitHub Pages，与本工作流无关。

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验标签与版本号一致
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $ver = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $ver) {
            Write-Error "标签 $tag 与 package.json 版本 $ver 不一致，请先更新版本号"
            exit 1
          }
          Write-Host "构建版本: $ver"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: 构建 Windows 安装包（NSIS + 免安装）
        run: npm run build:win

      - name: 构建商店 MSIX（未签名，提交商店后由微软重签）
        run: npm run build:msix

      - name: 创建 GitHub Release 并上传产物
        uses: softprops/action-gh-release@v2
        with:
          name: Git Repo Manager ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.msix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
